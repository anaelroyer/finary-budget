<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Budget & Patrimoine</title>
  <style>
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --border-color: #30363d;
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --accent-green: #238636;
      --accent-green-hover: #2ea043;
      --accent-red: #da3633;
      --accent-red-hover: #f85149;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    h2 {
      font-size: 18px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Grille ultra-large pour le libellé : Checkbox (28px) | Libellé (flexible) | Montant (90px) | Croix (28px) */
    .row {
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr) 90px 28px;
      gap: 6px;
      align-items: center;
      padding: 8px 4px;
      border-bottom: 1px solid #21262d;
      border-radius: 8px;
      transition: background 0.2s;
    }

    .row.paid {
      background-color: rgba(35, 134, 54, 0.15);
    }

    .row input[type="text"] {
      width: 100%;
      padding: 8px;
      background: #0d1117;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 14px;
      outline: none;
    }

    .row input[type="number"] {
      width: 100%;
      padding: 8px 6px;
      background: #0d1117;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: var(--text-main);
      font-size: 14px;
      text-align: right;
      outline: none;
    }

    .row input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: var(--accent-green);
      cursor: pointer;
    }

    .delete-btn {
      background: none;
      border: none;
      color: var(--accent-red);
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }

    .delete-btn:hover {
      color: var(--accent-red-hover);
    }

    .btn-green {
      background-color: var(--accent-green);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      width: 100%;
    }

    .btn-green:hover {
      background-color: var(--accent-green-hover);
    }

    .btn-red-outline {
      background: transparent;
      color: var(--accent-red);
      border: 1px solid var(--accent-red);
      border-radius: 8px;
      padding: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
      width: 100%;
      margin-top: 4px;
    }

    .btn-red-outline:hover {
      background-color: rgba(218, 54, 51, 0.1);
    }

    .summary-box {
      background: rgba(48, 54, 61, 0.4);
      padding: 12px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- En-tête Reste à vivre -->
    <div class="card">
      <h2>📊 Reste à vivre</h2>
      <div class="summary-box">
        <span>Total Net :</span>
        <span id="total-reste">0,00 €</span>
      </div>
    </div>

    <!-- Section Budget / Dépenses courantes -->
    <div class="card">
      <h2>🛒 Dépenses courantes</h2>
      <button class="btn-green" onclick="addItem('expenses')">+ Ajouter une dépense</button>
      <div id="expenses-list"></div>
      <button class="btn-red-outline" onclick="clearList('expenses')">Tout vider</button>
    </div>

    <!-- Section Entrées -->
    <div class="card">
      <h2>📥 Entrées</h2>
      <div id="income-list"></div>
      <button class="btn-green" onclick="addItem('income')">+ Ajouter revenu</button>
    </div>

    <!-- Section Frais fixes -->
    <div class="card">
      <h2>🏠 Frais fixes</h2>
      <div id="fixed-list"></div>
      <button class="btn-green" onclick="addItem('fixed')">+ Ajouter frais fixe</button>
    </div>

    <!-- Section Patrimoine -->
    <div class="card">
      <h2>🏛️ Patrimoine</h2>
      <div class="summary-box" style="margin-bottom: 8px;">
        <span>Total Patrimoine :</span>
        <span id="total-patrimoine">0,00 €</span>
      </div>
      <div id="patrimoine-list"></div>
      <button class="btn-green" onclick="addItem('patrimoine')">+ Ajouter actif / épargne</button>
    </div>
  </div>

  <script>
    let data = {
      expenses: [],
      income: [],
      fixed: [],
      patrimoine: []
    };

    function render() {
      renderSection('expenses', 'expenses-list');
      renderSection('income', 'income-list');
      renderSection('fixed', 'fixed-list');
      renderSection('patrimoine', 'patrimoine-list');
      calculateTotals();
    }

    function renderSection(sectionKey, containerId) {
      const container = document.getElementById(containerId);
      container.innerHTML = '';
      
      data[sectionKey].forEach((item, index) => {
        const row = document.createElement('div');
        // Les sections budget ont une checkbox, le patrimoine n'en a pas forcément besoin mais on garde la structure homogène ou masquée si besoin
        const hasCheckbox = sectionKey !== 'patrimoine';
        row.className = `row ${item.paid && hasCheckbox ? 'paid' : ''}`;
        
        row.innerHTML = `
          ${hasCheckbox ? `<input type="checkbox" ${item.paid ? 'checked' : ''} onchange="togglePaid('${sectionKey}', ${index})">` : `<div></div>`}
          <input type="text" value="${item.label || ''}" placeholder="Libellé" oninput="updateItem('${sectionKey}', ${index}, 'label', this.value)">
          <input type="number" value="${item.amount || ''}" placeholder="0" oninput="updateItem('${sectionKey}', ${index}, 'amount', this.value)">
          <button class="delete-btn" onclick="deleteItem('${sectionKey}', ${index})">✕</button>
        `;
        container.appendChild(row);
      });
    }

    function addItem(sectionKey) {
      data[sectionKey].push({ label: '', amount: '', paid: false });
      render();
    }

    function updateItem(sectionKey, index, field, value) {
      data[sectionKey][index][field] = field === 'amount' ? (value === '' ? '' : parseFloat(value) || 0) : value;
      calculateTotals();
    }

    function togglePaid(sectionKey, index) {
      data[sectionKey][index].paid = !data[sectionKey][index].paid;
      render();
    }

    function deleteItem(sectionKey, index) {
      data[sectionKey].splice(index, 1);
      render();
    }

    function clearList(sectionKey) {
      data[sectionKey] = [];
      render();
    }

    function calculateTotals() {
      const totalIncome = data.income.reduce((sum, item) => sum + (parseFloat(item.amount) || 0), 0);
      const totalExpenses = data.expenses.reduce((sum, item) => sum + (parseFloat(item.amount) || 0), 0);
      const totalFixed = data.fixed.reduce((sum, item) => sum + (parseFloat(item.amount) || 0), 0);
      const totalPatrimoine = data.patrimoine.reduce((sum, item) => sum + (parseFloat(item.amount) || 0), 0);
      
      const reste = totalIncome - (totalExpenses + totalFixed);
      
      document.getElementById('total-reste').innerText = reste.toLocaleString('fr-FR', { style: 'currency', currency: 'EUR' });
      document.getElementById('total-patrimoine').innerText = totalPatrimoine.toLocaleString('fr-FR', { style: 'currency', currency: 'EUR' });
    }

    render();
  </script>
</body>
</html>
