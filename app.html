<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Budget & Patrimoine — Finary Style</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0d1117;color:#e6edf3;line-height:1.5}
.wrap{max-width:1100px;margin:auto;padding:24px}

.nav-tabs{display:flex;gap:10px;margin-bottom:24px;border-bottom:1px solid #30363d;padding-bottom:12px;overflow-x:auto}
.tab-btn{background:transparent;border:0;color:#8b949e;font-size:16px;font-weight:600;padding:8px 16px;border-radius:8px;cursor:pointer;transition:all 0.2s;white-space:nowrap}
.tab-btn:hover{color:#fff;background:#21262d}
.tab-btn.active{background:#21262d;color:#58a6ff;border:1px solid #30363d}

.tab-content{display:none}
.tab-content.active{display:block}

.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:24px}
.top h1{margin:0;font-size:26px;font-weight:700;color:#fff}

.card{background:#161b22;border:1px solid #30363d;border-radius:16px;padding:22px;box-shadow:0 4px 20px rgba(0,0,0,0.4);margin-bottom:20px}
.total{font-size:38px;font-weight:800;margin:6px 0;letter-spacing:-0.5px;color:#58a6ff}
.total.green{color:#3fb950}
.total.red{color:#f85149}
.muted{color:#8b949e;font-size:13px;text-transform:uppercase;letter-spacing:0.5px;font-weight:600}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:16px}
.stat{background:#21262d;border:1px solid #30363d;border-radius:12px;padding:16px}
.stat span{font-size:13px;color:#8b949e}
.stat strong{display:block;font-size:20px;margin-top:4px;color:#fff}

.budget-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}

.section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.section-header h2{margin:0;font-size:18px;font-weight:600;color:#fff}

.row{display:grid;grid-template-columns:1.5fr 1fr 110px 40px;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #21262d}
.row.inv-row{grid-template-columns:1.2fr 0.8fr 0.8fr 110px 40px}
.row.dette-row{grid-template-columns:1.2fr 0.8fr minmax(60px, 80px) 110px 40px}
.row:last-child{border-bottom:0}
.row input{width:100%;padding:9px 12px;background:#0d1117;border:1px solid #30363d;border-radius:8px;color:#fff;font-size:14px;outline:none}
.row input:focus{border-color:#58a6ff}
.amount{text-align:right;font-weight:600;color:#c9d1d9}

.input-with-symbol{position:relative;display:flex;align-items:center}
.input-with-symbol input{padding-right:25px}
.input-with-symbol .symbol{position:absolute;right:10px;color:#8b949e;font-size:14px;pointer-events:none}

.history-table{width:100%;border-collapse:collapse;margin-top:10px}
.history-table th,.history-table td{padding:12px;text-align:left;border-bottom:1px solid #21262d;font-size:14px}
.history-table th{color:#8b949e;font-weight:600;text-transform:uppercase;font-size:12px;letter-spacing:0.5px}
.history-table td{color:#c9d1d9}

/* Style du graphique SVG */
.chart-container{margin-top:20px;padding-top:15px;border-top:1px solid #21262d}
.chart-container h3{font-size:14px;color:#8b949e;margin:0 0 10px 0;text-transform:uppercase;letter-spacing:0.5px}
svg.patrimoine-chart{width:100%;height:120px;overflow:visible}
.chart-line{fill:none;stroke:#58a6ff;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.chart-area{fill:url(#chart-gradient);opacity:0.25}
.chart-dot{fill:#58a6ff;stroke:#161b22;stroke-width:2;cursor:pointer;transition:transform 0.2s}
.chart-dot:hover{transform:scale(1.5)}

.btn{border:0;border-radius:8px;padding:9px 16px;cursor:pointer;font-weight:600;font-size:14px;transition:opacity 0.2s}
.btn:hover{opacity:0.9}
.btn-primary{background:#238636;color:#fff}
.btn-secondary{background:#21262d;color:#c9d1d9;border:1px solid #30363d;margin-left:5px}
.btn-add{background:transparent;color:#58a6ff;border:1px dashed #30363d;width:100%;margin-top:12px;padding:8px}
.btn-add:hover{background:#21262d;border-color:#58a6ff}
.btn-add-inline{background:#238636;color:#fff;border:none;padding:6px 12px;font-size:13px;font-weight:600;border-radius:6px;cursor:pointer;margin-right:12px}
.btn-add-inline:hover{opacity:0.9}
.btn-del{background:transparent;color:#f85149;border:none;cursor:pointer;font-size:16px;padding:4px 8px;border-radius:6px}
.btn-del:hover{background:rgba(248,81,73,0.1)}

@media print {
  body { background: #fff; color: #000; }
  .nav-tabs, .btn, .btn-add, .btn-add-inline, .btn-del, .chart-container, #tab-budget { display: none !important; }
  #tab-patrimoine { display: block !important; }
  .card { background: #fff !important; border: 1px solid #ddd !important; box-shadow: none !important; color: #000 !important; }
  .total { color: #000 !important; }
  .stat { background: #f6f8fa !important; border: 1px solid #ddd !important; }
  .stat span, .stat strong { color: #000 !important; }
  .muted { color: #555 !important; }
  .row input { background: transparent !important; border: none !important; color: #000 !important; padding: 0 !important; font-weight: 500; }
  .amount { color: #000 !important; }
  .symbol { color: #555 !important; }
  .section-header h2 { color: #000 !important; }
}

@media(max-width:900px){.budget-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('budget')">📅 Budget & Reste à vivre</button>
    <button class="tab-btn" onclick="switchTab('patrimoine')">📊 Patrimoine</button>
  </div>

  <div id="tab-budget" class="tab-content active">
    <div class="top">
      <div><h1>Budget Mensuel</h1></div>
      <button class="btn btn-primary" onclick="closeMonth()">🔒 Clôturer ce mois</button>
    </div>
    <div class="card">
      <div class="muted">Reste à vivre estimé</div>
      <div class="total green" id="budget-reste-vivre">0 €</div>
    </div>
    <div class="budget-grid">
      <div class="col-left">
        <div class="card"><div class="section-header"><h2>📥 Entrées</h2></div><div class="rows-container" data-key="budgetRevenus"></div><button class="btn btn-add" onclick="addItem('budgetRevenus')">+ Ajouter revenu</button></div>
        <div class="card"><div class="section-header"><h2>🏠 Frais fixes</h2></div><div class="rows-container" data-key="budgetFixes"></div><button class="btn btn-add" onclick="addItem('budgetFixes')">+ Ajouter frais fixe</button></div>
      </div>
      <div class="col-right">
        <div class="card">
          <div class="section-header">
            <h2>🛒 Dépenses courantes</h2>
            <div>
              <button class="btn-add-inline" onclick="addItem('budgetDepenses')">+ Ajouter</button>
              <button class="btn-del" onclick="clearList('budgetDepenses')" title="Vider tout">Vider</button>
            </div>
          </div>
          <div class="rows-container" data-key="budgetDepenses"></div>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="section-header">
        <h2>🗓️ Historique</h2>
        <div>
          <button class="btn btn-secondary" style="color:#f85149" onclick="resetHistory()">🗑️ Réinitialiser</button>
          <button class="btn btn-secondary" onclick="exportData()">⬇️ Exporter</button>
          <input type="file" id="importFile" style="display:none" onchange="importData(event)">
          <button class="btn btn-secondary" onclick="document.getElementById('importFile').click()">⬆️ Importer</button>
        </div>
      </div>
      <div id="history-container"></div>
    </div>
  </div>

  <div id="tab-patrimoine" class="tab-content">
    <div class="top"><div><h1>Patrimoine</h1></div><button class="btn btn-secondary" onclick="window.print()">🖨️ Imprimer</button></div>
    
    <div class="card">
      <div class="muted">Patrimoine net</div>
      <div class="total" id="net">0 €</div>
      <div class="grid">
        <div class="stat"><span>Actifs</span><strong id="assets">0 €</strong></div>
        <div class="stat"><span>Épargne</span><strong id="savings">0 €</strong></div>
        <div class="stat"><span>Emprunts</span><strong id="debts">0 €</strong></div>
        <div class="stat"><span>Invest.</span><strong id="investments">0 €</strong></div>
      </div>
      
      <!-- Graphique d'évolution -->
      <div class="chart-container">
        <h3>Évolution du Patrimoine Net</h3>
        <div id="chart-wrapper"></div>
      </div>
    </div>

    <div class="card"><div class="section-header"><h2>🏠 Immobilier</h2></div><div class="rows-container" data-key="immobilier"></div><button class="btn btn-add" onclick="addItem('immobilier')">+ Ajouter</button></div>
    <div class="card"><div class="section-header"><h2>💰 Épargne</h2></div><div class="rows-container" data-key="epargne"></div><button class="btn btn-add" onclick="addItem('epargne')">+ Ajouter</button></div>
    <div class="card"><div class="section-header"><h2>🛡️ Assurance-vie</h2></div><div class="rows-container" data-key="assurancevie"></div><button class="btn btn-add" onclick="addItem('assurancevie')">+ Ajouter</button></div>
    <div class="card"><div class="section-header"><h2>📈 Bourse</h2></div><div class="rows-container" data-key="bourse"></div><button class="btn btn-add" onclick="addItem('bourse')">+ Ajouter</button></div>
    <div class="card"><div class="section-header"><h2>🪙 Crypto</h2></div><div class="rows-container" data-key="crypto"></div><button class="btn btn-add" onclick="addItem('crypto')">+ Ajouter</button></div>
    <div class="card"><div class="section-header"><h2>💳 Emprunts</h2></div><div class="rows-container" data-key="dettes"></div><button class="btn btn-add" onclick="addItem('dettes')">+ Ajouter</button></div>
  </div>
</div>

<script>
let data = JSON.parse(localStorage.getItem('finaryData')) || {
  immobilier: [['Résidence principale', 300000]], epargne: [['Livret A', 20000]],
  assurancevie: [['Assurance-vie Principale', 15000]],
  bourse: [['ETF World', 10, 260]], crypto: [['Bitcoin', 0.5, 60000]], dettes: [['Crédit Immo', 150000, 1.5]],
  budgetRevenus: [['Salaire', 2500]], budgetFixes: [['Loyer', 900]], budgetDepenses: [['Courses', 400]]
};
let monthHistory = JSON.parse(localStorage.getItem('finaryHistory')) || [];
let patrimoineHistory = JSON.parse(localStorage.getItem('finaryPatrimoineHistory')) || [];

const euro = n => new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR' }).format(n);

function switchTab(t) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.toggle('active', el.id === 'tab-'+t));
  document.querySelectorAll('.tab-btn').forEach(el => el.classList.toggle('active', el.innerText.includes(t==='budget'?'Budget':'Patrimoine')));
}

function render() {
  ['immobilier', 'epargne', 'assurancevie', 'bourse', 'crypto', 'dettes', 'budgetRevenus', 'budgetFixes', 'budgetDepenses'].forEach(key => {
    const cont = document.querySelector(`.rows-container[data-key="${key}"]`);
    if(!cont) return;
    cont.innerHTML = '';
    
    if (!Array.isArray(data[key])) data[key] = [];

    data[key].forEach((item, idx) => {
      const row = document.createElement('div');
      const isMultiCol = (key === 'bourse' || key === 'crypto');
      row.className = isMultiCol ? 'row inv-row' : (key === 'dettes' ? 'row dette-row' : 'row');
      
      if (isMultiCol) {
        row.innerHTML = `<input type="text" value="${item[0] || ''}" onchange="update('${key}',${idx},0,this.value)"><input type="number" value="${item[1] || 0}" onchange="update('${key}',${idx},1,this.value)"><input type="number" value="${item[2] || 0}" onchange="update('${key}',${idx},2,this.value)"><div class="amount">${euro((item[1]||0)*(item[2]||0))}</div><button class="btn-del" onclick="del('${key}',${idx})">×</button>`;
      } else if (key === 'dettes') {
        row.innerHTML = `<input type="text" value="${item[0] || ''}" onchange="update('${key}',${idx},0,this.value)"><input type="number" value="${item[1] || 0}" onchange="update('${key}',${idx},1,this.value)"><div class="input-with-symbol"><input type="number" step="0.01" value="${item[2] || 0}" onchange="update('${key}',${idx},2,this.value)"><span class="symbol">%</span></div><div class="amount">${euro(item[1]||0)}</div><button class="btn-del" onclick="del('${key}',${idx})">×</button>`;
      } else {
        row.innerHTML = `<input type="text" value="${item[0] || ''}" onchange="update('${key}',${idx},0,this.value)"><input type="number" value="${item[1] || 0}" onchange="update('${key}',${idx},1,this.value)"><div class="amount">${euro(item[1]||0)}</div><button class="btn-del" onclick="del('${key}',${idx})">×</button>`;
      }
      cont.appendChild(row);
    });
  });
  updateTotals();
  renderHistory();
  recordPatrimoineSnapshot();
  renderChart();
}

function update(k, i, p, v) { 
  if(!data[k][i]) return;
  data[k][i][p] = p === 0 ? v : Number(v); 
  render(); 
  save(); 
}

function addItem(k) { 
  if(!data[k]) data[k] = [];
  
  let defaultItem = ['Nouveau', 0];
  if (k === 'bourse' || k === 'crypto') defaultItem = ['Actif', 1, 0];
  else if (k === 'dettes') defaultItem = ['Emprunt', 0, 0];
  
  if (k === 'budgetDepenses') {
    data[k].unshift(defaultItem);
  } else {
    data[k].push(defaultItem);
  }
  
  render(); 
  save(); 
}

function del(k, i) { 
  data[k].splice(i, 1); 
  render(); 
  save(); 
}

function clearList(k) { 
  data[k] = []; 
  render(); 
  save(); 
}

function save() { 
  localStorage.setItem('finaryData', JSON.stringify(data)); 
  localStorage.setItem('finaryHistory', JSON.stringify(monthHistory)); 
  localStorage.setItem('finaryPatrimoineHistory', JSON.stringify(patrimoineHistory));
}

function calculateNet() {
  const assetKeys = ['immobilier', 'epargne', 'assurancevie', 'bourse', 'crypto'];
  const assets = assetKeys.reduce((s, k) => {
    if (!data[k]) return s;
    return s + data[k].reduce((a, i) => a + ((k==='bourse'||k==='crypto')?(i[1]||0)*(i[2]||0):(i[1]||0)), 0);
  }, 0);
  const debts = (data.dettes || []).reduce((s, i) => s + (i[1]||0), 0);
  return { assets, debts, net: assets - debts };
}

function updateTotals() {
  const c = calculateNet();
  document.getElementById('net').textContent = euro(c.net);
  document.getElementById('assets').textContent = euro(c.assets);
  document.getElementById('debts').textContent = euro(c.debts);
  
  const savingsTotal = (data.epargne || []).reduce((a, i) => a + (i[1]||0), 0);
  document.getElementById('savings').textContent = euro(savingsTotal);

  const bourseTotal = (data.bourse || []).reduce((a, i) => a + ((i[1]||0)*(i[2]||0)), 0);
  const cryptoTotal = (data.crypto || []).reduce((a, i) => a + ((i[1]||0)*(i[2]||0)), 0);
  document.getElementById('investments').textContent = euro(bourseTotal + cryptoTotal);

  const rev = (data.budgetRevenus || []).reduce((s,i)=>s+(i[1]||0),0);
  const fixes = (data.budgetFixes || []).reduce((s,i)=>s+(i[1]||0),0);
  const dep = (data.budgetDepenses || []).reduce((s,i)=>s+(i[1]||0),0);
  const rv = rev - fixes - dep;

  document.getElementById('budget-reste-vivre').textContent = euro(rv);
  document.getElementById('budget-reste-vivre').className = 'total ' + (rv>=0?'green':'red');
}

function recordPatrimoineSnapshot() {
  const today = new Date().toISOString().split('T')[0];
  const currentNet = calculateNet().net;

  const existing = patrimoineHistory.find(h => h.date === today);
  if (existing) {
    existing.net = currentNet;
  } else {
    patrimoineHistory.push({ date: today, net: currentNet });
    patrimoineHistory.sort((a, b) => new Date(a.date) - new Date(b.date));
  }
  save();
}

function closeMonth() {
  const rev = (data.budgetRevenus || []).reduce((s,i)=>s+(i[1]||0),0);
  const fixes = (data.budgetFixes || []).reduce((s,i)=>s+(i[1]||0),0);
  const dep = (data.budgetDepenses || []).reduce((s,i)=>s+(i[1]||0),0);
  monthHistory.unshift({ 
    month: new Date().toLocaleDateString('fr-FR', {month:'long', year:'numeric'}), 
    revenus: rev, 
    fixes: fixes, 
    depenses: dep, 
    resteVivre: rev - fixes - dep
  });
  save(); render();
}

function resetHistory() {
  if (confirm("Supprimer l'historique des budgets ?")) {
    monthHistory = [];
    localStorage.removeItem('finaryHistory');
    render();
  }
}

function renderHistory() {
  const cont = document.getElementById('history-container');
  if(!cont) return;
  cont.innerHTML = monthHistory.length === 0 ? '<p style="color:#8b949e; font-size:14px;">Aucun historique de budget.</p>' : 
    `<table class="history-table"><thead><tr><th>Mois</th><th>Revenus</th><th>Fixes</th><th>Dépenses</th><th>Reste</th></tr></thead><tbody>` + 
    monthHistory.map(h => `<tr><td>${h.month}</td><td>${euro(h.revenus)}</td><td>${euro(h.fixes)}</td><td>${euro(h.depenses)}</td><td style="color:${h.resteVivre>=0?'#3fb950':'#f85149'}">${euro(h.resteVivre)}</td></tr>`).join('') + `</tbody></table>`;
}

function renderChart() {
  const container = document.getElementById('chart-wrapper');
  if (!container) return;

  if (patrimoineHistory.length === 0) {
    container.innerHTML = '<p style="color:#8b949e; font-size:13px; text-align:center; margin:10px 0;">Chargement du graphique...</p>';
    return;
  }

  const values = patrimoineHistory.map(h => h.net);
  const labels = patrimoineHistory.map(h => {
    const parts = h.date.split('-');
    return `${parts[2]}/${parts[1]}/${parts[0]}`;
  });

  const width = 800;
  const height = 110;
  const padding = 20;

  const min = Math.min(...values);
  const max = Math.max(...values);
  const range = max - min === 0 ? 1 : max - min;

  const points = values.map((val, idx) => {
    const x = padding + (idx / (values.length - 1 || 1)) * (width - padding * 2);
    const y = height - padding - ((val - min) / range) * (height - padding * 2);
    return { x, y, val, label: labels[idx] };
  });

  const pathD = points.length === 1 
    ? `M ${points[0].x} ${points[0].y} L ${points[0].x} ${points[0].y}`
    : points.reduce((acc, p, i) => i === 0 ? `M ${p.x} ${p.y}` : `${acc} L ${p.x} ${p.y}`, '');

  const areaD = points.length === 1
    ? `M ${points[0].x} ${height} L ${points[0].x} ${points[0].y} L ${points[0].x} ${height} Z`
    : `M ${points[0].x} ${height} ${points.map(p => `L ${p.x} ${p.y}`).join(' ')} L ${points[points.length-1].x} ${height} Z`;

  let svgContent = `
    <svg viewBox="0 0 ${width} ${height}" class="patrimoine-chart">
      <defs>
        <linearGradient id="chart-gradient" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#58a6ff" />
          <stop offset="100%" stop-color="#58a6ff" stop-opacity="0" />
        </linearGradient>
      </defs>
      <path d="${areaD}" class="chart-area" />
      <path d="${pathD}" class="chart-line" />
  `;

  points.forEach(p => {
    svgContent += `<circle cx="${p.x}" cy="${p.y}" r="4" class="chart-dot"><title>${p.label} : ${euro(p.val)}</title></circle>`;
  });

  svgContent += `</svg>`;
  container.innerHTML = svgContent;
}

function exportData() {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify({data, monthHistory, patrimoineHistory})])); a.download = 'budget.json'; a.click();
}
function importData(e) {
  const r = new FileReader(); r.onload = (e) => { const j = JSON.parse(e.target.result); data = j.data; monthHistory = j.monthHistory || []; patrimoineHistory = j.patrimoineHistory || []; render(); save(); }; r.readAsText(e.target.files[0]);
}

render();
</script>
</body>
</html>
