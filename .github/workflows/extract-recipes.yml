# SECURITY_SSRF_V1 — validation réseau stricte des URL de recettes
name: Extraire les ingrédients des recettes

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

jobs:
  extract-recipes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Authentification serveur Firestore
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: node google-firestore-token.mjs

      - name: Lire les recettes et synchroniser les ingrédients
        run: |
          python3 - <<'PY'
          import hashlib
          import html
          import http.client
          import ipaddress
          import json
          import os
          import re
          import socket
          import ssl
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone, timedelta
          from html.parser import HTMLParser
          FIREBASE_PROJECT = "finances-royer"
          FIRESTORE_DOC = "budget_shared/main_account"

          def now_iso():
              return datetime.now(timezone.utc).isoformat(timespec="milliseconds").replace("+00:00", "Z")

          def request_json(url, headers=None, data=None, method=None):
              body = None if data is None else json.dumps(data).encode("utf-8")
              req = urllib.request.Request(
                  url,
                  data=body,
                  headers={
                      "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36",
                      "Accept": "application/json,text/html,application/xhtml+xml,*/*",
                      "Accept-Encoding": "identity",
                      "Content-Type": "application/json",
                      **(headers or {}),
                  },
                  method=method or ("POST" if body is not None else "GET"),
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      raw=response.read()
                      ctype=response.headers.get_content_charset() or "utf-8"
                      return json.loads(raw.decode(ctype, errors="replace"))
              except urllib.error.HTTPError as e:
                  detail=e.read().decode("utf-8", errors="ignore")
                  raise RuntimeError(f"HTTP {e.code} sur {url}: {detail[:500]}") from e

          # Protection SSRF des URL de recettes.
          # Les URL sont fournies par les données de l'application et doivent pouvoir
          # pointer vers des sites de recettes variés : on n'utilise donc pas une liste
          # fermée de domaines, mais on impose une destination HTTP(S) publique.
          RECIPE_ALLOWED_SCHEMES={"http","https"}
          RECIPE_MAX_REDIRECTS=5
          RECIPE_MAX_HTML_BYTES=4*1024*1024
          RECIPE_TIMEOUT_SECONDS=15
          RECIPE_HOST_RE=re.compile(
              r"^(?=.{1,253}\.?$)(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.?$",
              re.I,
          )

          def public_recipe_target(url):
              url=str(url or "").strip()
              if not url or len(url)>2048:
                  raise RuntimeError("URL de recette invalide")
              if any(ord(ch)<32 or ord(ch)==127 for ch in url):
                  raise RuntimeError("URL de recette contenant des caractères interdits")

              try:
                  parts=urllib.parse.urlsplit(url)
              except Exception as exc:
                  raise RuntimeError("URL de recette impossible à analyser") from exc

              scheme=(parts.scheme or "").lower()
              if scheme not in RECIPE_ALLOWED_SCHEMES:
                  raise RuntimeError("Seules les URL http:// et https:// sont autorisées")
              if parts.username is not None or parts.password is not None:
                  raise RuntimeError("Les identifiants intégrés dans une URL sont interdits")
              if not parts.hostname:
                  raise RuntimeError("Nom de domaine absent")

              try:
                  host=parts.hostname.rstrip(".").encode("idna").decode("ascii").lower()
              except Exception as exc:
                  raise RuntimeError("Nom de domaine invalide") from exc

              # On refuse les IP saisies directement : une recette normale utilise
              # un nom de domaine, et cela élimine plusieurs formes d'URL ambiguës.
              try:
                  ipaddress.ip_address(host)
                  raise RuntimeError("Les URL de recette utilisant directement une adresse IP sont interdites")
              except ValueError:
                  pass

              if (
                  host=="localhost"
                  or host.endswith(".localhost")
                  or host.endswith(".local")
                  or host.endswith(".internal")
                  or host.endswith(".home.arpa")
                  or not RECIPE_HOST_RE.fullmatch(host)
              ):
                  raise RuntimeError("Nom de domaine non public ou invalide")

              try:
                  port=parts.port
              except ValueError as exc:
                  raise RuntimeError("Port invalide dans l'URL") from exc

              default_port=443 if scheme=="https" else 80
              if port is not None and port!=default_port:
                  raise RuntimeError("Seuls les ports web standards 80 et 443 sont autorisés")
              port=port or default_port

              try:
                  infos=socket.getaddrinfo(host,port,type=socket.SOCK_STREAM)
              except socket.gaierror as exc:
                  raise RuntimeError("Nom de domaine de la recette introuvable") from exc

              addresses=[]
              for info in infos:
                  addr=info[4][0]
                  try:
                      ip=ipaddress.ip_address(addr)
                  except ValueError:
                      continue
                  # is_global exclut notamment loopback, privé, link-local,
                  # multicast, non spécifié et plages réservées/spéciales.
                  if not ip.is_global:
                      raise RuntimeError(
                          f"Destination réseau non publique interdite ({ip.compressed})"
                      )
                  if ip.compressed not in addresses:
                      addresses.append(ip.compressed)

              if not addresses:
                  raise RuntimeError("Aucune adresse IP publique disponible pour ce domaine")

              # IPv4 d'abord pour une meilleure compatibilité des runners,
              # tout en conservant IPv6 si nécessaire.
              addresses.sort(key=lambda x: 1 if ":" in x else 0)
              return url,parts,host,port,addresses

          class PinnedHTTPConnection(http.client.HTTPConnection):
              def __init__(self,host,port,connect_ip,timeout):
                  super().__init__(host,port=port,timeout=timeout)
                  self._connect_ip=connect_ip
              def connect(self):
                  self.sock=socket.create_connection(
                      (self._connect_ip,self.port),
                      self.timeout,
                      self.source_address,
                  )

          class PinnedHTTPSConnection(http.client.HTTPSConnection):
              def __init__(self,host,port,connect_ip,timeout):
                  super().__init__(
                      host,
                      port=port,
                      timeout=timeout,
                      context=ssl.create_default_context(),
                  )
                  self._connect_ip=connect_ip
              def connect(self):
                  sock=socket.create_connection(
                      (self._connect_ip,self.port),
                      self.timeout,
                      self.source_address,
                  )
                  # Le certificat reste vérifié contre le vrai nom de domaine,
                  # bien que la connexion TCP soit épinglée sur l'IP déjà validée.
                  self.sock=self._context.wrap_socket(sock,server_hostname=self.host)

          def fetch_html(url):
              current=str(url or "").strip()

              for redirect_count in range(RECIPE_MAX_REDIRECTS+1):
                  current,parts,host,port,addresses=public_recipe_target(current)

                  path=urllib.parse.quote(
                      parts.path or "/",
                      safe="/%:@!$&'()*+,;=-._~",
                  )
                  if parts.query:
                      query=urllib.parse.quote(
                          parts.query,
                          safe="=&?/:;+,%@!$'()*-._~",
                      )
                      path+="?"+query

                  headers={
                      "Host":host,
                      "User-Agent":"Mozilla/5.0 (iPhone; CPU iPhone OS 17_5 like Mac OS X) AppleWebKit/605.1.15 Version/17.5 Mobile/15E148 Safari/604.1",
                      "Accept":"text/html,application/xhtml+xml",
                      "Accept-Language":"fr-FR,fr;q=0.9,en;q=0.7",
                      "Accept-Encoding":"identity",
                      "Connection":"close",
                  }

                  last_error=None
                  redirected=False

                  for connect_ip in addresses:
                      conn=None
                      try:
                          if parts.scheme.lower()=="https":
                              conn=PinnedHTTPSConnection(
                                  host,port,connect_ip,RECIPE_TIMEOUT_SECONDS
                              )
                          else:
                              conn=PinnedHTTPConnection(
                                  host,port,connect_ip,RECIPE_TIMEOUT_SECONDS
                              )

                          conn.request("GET",path,headers=headers)
                          response=conn.getresponse()
                          status=int(response.status)

                          if status in (301,302,303,307,308):
                              location=response.getheader("Location")
                              response.read(4096)
                              if not location:
                                  raise RuntimeError("Redirection sans destination")
                              if redirect_count>=RECIPE_MAX_REDIRECTS:
                                  raise RuntimeError("Trop de redirections HTTP")
                              current=urllib.parse.urljoin(current,location)
                              # La nouvelle destination sera entièrement revalidée,
                              # y compris DNS/IP/port/protocole.
                              redirected=True
                              break

                          if status<200 or status>=300:
                              response.read(4096)
                              raise RuntimeError(f"HTTP {status} lors de la lecture de la recette")

                          content_length=response.getheader("Content-Length")
                          if content_length:
                              try:
                                  if int(content_length)>RECIPE_MAX_HTML_BYTES:
                                      raise RuntimeError("Page de recette trop volumineuse")
                              except ValueError:
                                  pass

                          raw=response.read(RECIPE_MAX_HTML_BYTES+1)
                          if len(raw)>RECIPE_MAX_HTML_BYTES:
                              raise RuntimeError("Page de recette trop volumineuse")

                          content_type=(response.getheader("Content-Type") or "").lower()
                          if content_type and not (
                              "text/html" in content_type
                              or "application/xhtml+xml" in content_type
                              or "text/plain" in content_type
                          ):
                              raise RuntimeError("Le lien ne renvoie pas une page HTML")

                          enc=response.headers.get_content_charset() or "utf-8"
                          return raw.decode(enc,errors="replace")

                      except (
                          OSError,
                          ssl.SSLError,
                          http.client.HTTPException,
                          RuntimeError,
                      ) as exc:
                          last_error=exc
                          # Une erreur de sécurité ne doit pas être contournée
                          # en essayant une autre IP du même domaine.
                          if isinstance(exc,RuntimeError):
                              raise
                      finally:
                          if conn is not None:
                              try:
                                  conn.close()
                              except Exception:
                                  pass

                  if redirected:
                      continue
                  if last_error is not None:
                      raise RuntimeError(f"Impossible de joindre le site de recette : {last_error}")
                  raise RuntimeError("Impossible de joindre le site de recette")

              raise RuntimeError("Trop de redirections HTTP")

          class JsonLdParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.in_jsonld=False
                  self.buf=[]
                  self.blocks=[]
              def handle_starttag(self,tag,attrs):
                  if tag.lower()!="script":
                      return
                  attrs=dict(attrs)
                  t=(attrs.get("type") or "").lower().strip()
                  if "ld+json" in t:
                      self.in_jsonld=True
                      self.buf=[]
              def handle_endtag(self,tag):
                  if tag.lower()=="script" and self.in_jsonld:
                      self.blocks.append("".join(self.buf).strip())
                      self.in_jsonld=False
                      self.buf=[]
              def handle_data(self,data):
                  if self.in_jsonld:
                      self.buf.append(data)

          def is_recipe_type(v):
              if isinstance(v,str):
                  return v.lower()=="recipe" or v.lower().endswith("/recipe")
              if isinstance(v,list):
                  return any(is_recipe_type(x) for x in v)
              return False

          def find_recipe(obj):
              if isinstance(obj,dict):
                  if is_recipe_type(obj.get("@type")):
                      return obj
                  # @graph est très fréquent
                  for k in ("@graph","mainEntity","mainEntityOfPage","itemListElement"):
                      if k in obj:
                          found=find_recipe(obj[k])
                          if found:
                              return found
                  for v in obj.values():
                      found=find_recipe(v)
                      if found:
                          return found
              elif isinstance(obj,list):
                  for x in obj:
                      found=find_recipe(x)
                      if found:
                          return found
              return None

          def clean_ingredient(x):
              if isinstance(x,dict):
                  x=x.get("text") or x.get("name") or ""
              x=html.unescape(str(x or ""))
              x=re.sub(r"<[^>]+>"," ",x)
              x=re.sub(r"\s+"," ",x).strip(" \t\r\n•-")
              return x

          def extract_recipe(url):
              page=fetch_html(url)
              parser=JsonLdParser()
              parser.feed(page)

              last_error=""
              for block in parser.blocks:
                  if not block:
                      continue
                  candidates=[block]
                  # Quelques pages entourent le JSON-LD de commentaires JS.
                  cleaned=re.sub(r"^\s*<!--|-->\s*$","",block.strip())
                  if cleaned!=block:
                      candidates.append(cleaned)
                  for candidate in candidates:
                      try:
                          obj=json.loads(candidate)
                      except Exception as exc:
                          last_error=str(exc)
                          continue
                      recipe=find_recipe(obj)
                      if not recipe:
                          continue
                      ingredients=recipe.get("recipeIngredient") or recipe.get("ingredients") or []
                      if isinstance(ingredients,str):
                          ingredients=[ingredients]
                      ingredients=[clean_ingredient(x) for x in ingredients]
                      ingredients=[x for x in ingredients if x]
                      title=clean_ingredient(recipe.get("name") or "")
                      if ingredients:
                          return {
                              "status":"ok",
                              "title":title,
                              "ingredients":ingredients[:120],
                          }

              raise RuntimeError("Aucune liste d’ingrédients Recipe/JSON-LD exploitable trouvée" + (f" ({last_error})" if last_error else ""))

          def fs_to_python(value):
              if not isinstance(value,dict):
                  return None
              if "stringValue" in value:return value["stringValue"]
              if "booleanValue" in value:return value["booleanValue"]
              if "integerValue" in value:
                  try:return int(value["integerValue"])
                  except:return 0
              if "doubleValue" in value:
                  try:return float(value["doubleValue"])
                  except:return 0.0
              if "nullValue" in value:return None
              if "arrayValue" in value:
                  return [fs_to_python(x) for x in value["arrayValue"].get("values",[])]
              if "mapValue" in value:
                  return {k:fs_to_python(v) for k,v in value["mapValue"].get("fields",{}).items()}
              return None

          def python_to_fs(value):
              if value is None:return {"nullValue":None}
              if isinstance(value,bool):return {"booleanValue":value}
              if isinstance(value,int):return {"integerValue":str(value)}
              if isinstance(value,float):return {"doubleValue":value}
              if isinstance(value,str):return {"stringValue":value}
              if isinstance(value,list):return {"arrayValue":{"values":[python_to_fs(x) for x in value]}}
              if isinstance(value,dict):return {"mapValue":{"fields":{str(k):python_to_fs(v) for k,v in value.items()}}}
              return {"stringValue":str(value)}

          token=os.environ.get("GOOGLE_FIRESTORE_TOKEN","").strip()
          if not token:
              raise RuntimeError("Jeton serveur Firestore manquant")
          fs_headers={"Authorization":"Bearer "+token}

          doc_url=(
              f"https://firestore.googleapis.com/v1/projects/{FIREBASE_PROJECT}"
              f"/databases/(default)/documents/{FIRESTORE_DOC}"
          )
          current=request_json(doc_url,headers=fs_headers)
          fields=current.get("fields",{})

          data_raw=fields.get("data",{}).get("stringValue","")
          if not data_raw:
              raise RuntimeError("Champ data Firebase absent")
          app_data=json.loads(data_raw)

          existing=fs_to_python(fields.get("recipeData",{"mapValue":{"fields":{}}})) or {}
          dish_stats=((app_data.get("menus") or {}).get("dishStats") or {})

          wanted={}
          for stat in dish_stats.values():
              if not isinstance(stat,dict):
                  continue
              url=str(stat.get("recipeUrl") or "").strip()
              label=str(stat.get("label") or "").strip()
              if url:
                  # Même URL = même extraction, quel que soit le nom du plat.
                  h=2166136261
                  for b in url.encode("utf-8"):
                      h ^= b
                      h = (h * 16777619) & 0xffffffff
                  key="u"+format(h,"x")
                  wanted[key]={"url":url,"label":label}

          if not wanted:
              print("Aucune recette avec URL à analyser.")
              raise SystemExit(0)

          out={}
          changed=False
          for key,item in wanted.items():
              url=item["url"]
              label=item["label"]
              cached=existing.get(key) if isinstance(existing,dict) else None

              # Succès déjà sauvegardé pour cette URL : ne jamais réinterroger le site.
              if isinstance(cached,dict) and cached.get("url")==url and cached.get("status")=="ok" and cached.get("ingredients"):
                  out[key]=cached
                  print(f"CACHE {label or url}: {len(cached.get('ingredients') or [])} ingrédients")
                  continue

              # Une URL en erreur n'est retentée qu'après 6 h pour éviter de marteler
              # un site indisponible ou une page qui ne fournit pas de Recipe/JSON-LD.
              if isinstance(cached,dict) and cached.get("url")==url and cached.get("status")=="error":
                  try:
                      fetched=datetime.fromisoformat(str(cached.get("fetchedAt") or "").replace("Z","+00:00"))
                      if datetime.now(timezone.utc)-fetched < timedelta(hours=6):
                          out[key]=cached
                          print(f"ATTENTE {label or url}: nouvel essai après 6 h")
                          continue
                  except Exception:
                      pass

              try:
                  rec=extract_recipe(url)
                  out[key]={
                      "url":url,
                      "label":label,
                      "status":"ok",
                      "title":rec.get("title") or label,
                      "ingredients":rec.get("ingredients") or [],
                      "fetchedAt":now_iso(),
                      "error":"",
                  }
                  changed=True
                  print(f"OK {label or url}: {len(out[key]['ingredients'])} ingrédients")
              except Exception as exc:
                  out[key]={
                      "url":url,
                      "label":label,
                      "status":"error",
                      "title":label,
                      "ingredients":[],
                      "fetchedAt":now_iso(),
                      "error":str(exc)[:500],
                  }
                  changed=True
                  print(f"ERREUR {label or url}: {exc}")

          # Supprime automatiquement du cache les URLs qui ne sont plus utilisées.
          if set(existing.keys()) != set(out.keys()):
              changed=True

          if not changed:
              print("Aucune mise à jour à écrire.")
              raise SystemExit(0)

          patch_url=doc_url+"?updateMask.fieldPaths=recipeData"
          request_json(
              patch_url,
              headers=fs_headers,
              data={"fields":{"recipeData":python_to_fs(out)}},
              method="PATCH",
          )
          print(f"Firebase mis à jour : {len(out)} recette(s).")
          PY
