name: Mise à jour des cours

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update-quotes:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Récupérer les cours Euronext
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import re
          import html as html_lib
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          HEADERS = {
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/124 Safari/537.36",
              "Accept-Language": "en-US,en;q=0.9",
          }

          INSTRUMENTS = {
              "IE00B4ND3602": {
                  "url": "https://live.euronext.com/en/product/etfs/IE00B4ND3602-ETFP",
                  "source": "Euronext · ETFP",
                  "min": 10,
                  "max": 200,
              },
              "IE0002XZSHO1": {
                  "url": "https://live.euronext.com/en/product/etfs/IE0002XZSHO1-XPAR",
                  "source": "Euronext Paris · WPEA",
                  "min": 1,
                  "max": 20,
              },
              "FR0013412020": {
                  "url": "https://live.euronext.com/en/product/etfs/FR0013412020-XPAR",
                  "source": "Euronext Paris · PAEEM",
                  "min": 20,
                  "max": 60,
              },
          }

          def fetch(url):
              req = urllib.request.Request(url, headers=HEADERS)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return r.read().decode("utf-8", errors="ignore")

          def textify(raw):
              raw = re.sub(r"<script\b[^>]*>.*?</script>", " ", raw, flags=re.I | re.S)
              raw = re.sub(r"<style\b[^>]*>.*?</style>", " ", raw, flags=re.I | re.S)
              raw = re.sub(r"<[^>]+>", " ", raw)
              raw = html_lib.unescape(raw)
              return re.sub(r"\s+", " ", raw).strip()

          def number(s):
              s = s.strip().replace("\u202f", "").replace("\xa0", "")
              if "," in s and "." in s:
                  if s.rfind(",") > s.rfind("."):
                      s = s.replace(".", "").replace(",", ".")
                  else:
                      s = s.replace(",", "")
              else:
                  s = s.replace(",", ".")
              return float(s)

          def parse_euronext(raw, low, high):
              text = textify(raw)
              patterns = [
                  r"Last Traded\s*(?:\||:)?\s*([0-9]+(?:[.,][0-9]+)?)",
                  r"Dernier traité\s*(?:\||:)?\s*([0-9]+(?:[.,][0-9]+)?)",
                  r"Valuation Close\s*(?:\||:)?\s*([0-9]+(?:[.,][0-9]+)?)",
              ]
              for pattern in patterns:
                  m = re.search(pattern, text, flags=re.I)
                  if m:
                      value = number(m.group(1))
                      if low < value < high:
                          return value
              return None

          path = Path("quotes.json")
          try:
              payload = json.loads(path.read_text(encoding="utf-8"))
          except Exception:
              payload = {"quotes": {}}

          payload.setdefault("quotes", {})
          now = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")
          successes = 0
          failures = []

          for isin, cfg in INSTRUMENTS.items():
              try:
                  raw = fetch(cfg["url"])
                  price = parse_euronext(raw, cfg["min"], cfg["max"])
                  if price is None:
                      raise RuntimeError("champ Last Traded introuvable")

                  payload["quotes"][isin] = {
                      "price": round(price, 6),
                      "currency": "EUR",
                      "source": cfg["source"],
                      "sourceUrl": cfg["url"],
                      "updatedAt": now,
                  }
                  successes += 1
                  print(f"OK {isin} = {price:.6f} EUR via {cfg['source']}")
              except Exception as e:
                  failures.append(f"{isin}: {e}")
                  print(f"ERREUR {isin}: {e} — ancien cours conservé")

          if successes:
              payload["updatedAt"] = now

          path.write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )

          print(f"\nRésultat : {successes}/3 cours récupérés.")
          if failures:
              print("Échecs :")
              for f in failures:
                  print(" -", f)

          # Pour le test V17 : l'Action devient rouge si aucun cours Euronext
          # n'est accessible, afin de ne plus masquer un échec complet.
          if successes == 0:
              raise SystemExit("Aucun cours Euronext récupéré.")
          PY

      - name: Enregistrer quotes.json
        shell: bash
        run: |
          if git diff --quiet -- quotes.json; then
            echo "Aucune modification de quotes.json."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quotes.json
          git commit -m "Mise à jour automatique des cours Euronext"
          git push
