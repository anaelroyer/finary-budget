name: Mise à jour des cours

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update-quotes:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Récupérer les cours
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          HEADERS = {
              "User-Agent": "Mozilla/5.0",
              "Accept": "application/json",
          }

          def fetch_json(url):
              req = urllib.request.Request(url, headers=HEADERS)
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read().decode("utf-8"))

          def yahoo_last(symbol):
              url = f"https://query1.finance.yahoo.com/v8/finance/chart/{symbol}?interval=1d&range=5d"
              data = fetch_json(url)
              result = data.get("chart", {}).get("result")
              if not result:
                  raise RuntimeError(f"Yahoo: aucun résultat pour {symbol}")
              r = result[0]
              meta = r.get("meta", {})
              price = meta.get("regularMarketPrice")
              if not price:
                  closes = r.get("indicators", {}).get("quote", [{}])[0].get("close", [])
                  closes = [x for x in closes if isinstance(x, (int, float))]
                  price = closes[-1] if closes else None
              if not price:
                  raise RuntimeError(f"Yahoo: aucun cours pour {symbol}")
              return float(price), url

          instruments = {
              "IE0002XZSHO1": {
                  "symbol": "WPEA.PA",
                  "source": "Yahoo Finance · Euronext Paris",
              },
              "FR0013412020": {
                  "symbol": "PAEEM.PA",
                  "source": "Yahoo Finance · Euronext Paris",
              },
          }

          path = Path("quotes.json")
          try:
              payload = json.loads(path.read_text(encoding="utf-8"))
          except Exception:
              payload = {"quotes": {}}

          payload.setdefault("quotes", {})
          now = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")
          payload["updatedAt"] = now

          failures = []

          # On conserve IE00B4ND3602 tel quel dans quotes.json.
          # Les deux ETF ci-dessous sont mis à jour via Yahoo Finance.
          for isin, cfg in instruments.items():
              try:
                  price, source_url = yahoo_last(cfg["symbol"])
                  payload["quotes"][isin] = {
                      "price": round(price, 6),
                      "currency": "EUR",
                      "source": cfg["source"],
                      "sourceUrl": source_url,
                      "updatedAt": now,
                  }
                  print(f"✅ {isin} ({cfg['symbol']}) = {price:.6f} EUR")
              except Exception as e:
                  failures.append(f"{isin}: {e}")
                  print(f"⚠️ {isin}: échec, ancien cours conservé")

          path.write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )

          if failures:
              print("\nÉchecs :")
              for f in failures:
                  print(" -", f)
          PY

      - name: Enregistrer quotes.json
        shell: bash
        run: |
          if git diff --quiet -- quotes.json; then
            echo "Aucune modification."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quotes.json
          git commit -m "Mise à jour automatique des cours"
          git push
