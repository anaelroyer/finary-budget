<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Réinitialisation du cache</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0d1117;color:#e6edf3;display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0;padding:20px}
.card{max-width:440px;width:100%;background:#161b22;border:1px solid #30363d;border-radius:16px;padding:22px}
h1{font-size:20px;margin:0 0 12px}
p{color:#c9d1d9;line-height:1.5}
.ok{color:#3fb950;font-weight:700}
.err{color:#f85149;font-weight:700}
button{width:100%;padding:12px;border:0;border-radius:9px;background:#238636;color:#fff;font-weight:700;font-size:15px;cursor:pointer}
</style>
</head>
<body>
<div class="card">
<h1>Restauration de l'application personnelle</h1>
<p id="status">Nettoyage du cache PWA en cours…</p>
<button id="openBtn" style="display:none" onclick="location.href='./app.html?personal=20260827'">Ouvrir mon application</button>
</div>
<script>
(async()=>{
  const status=document.getElementById('status');
  try{
    if('serviceWorker' in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
    status.className='ok';
    status.textContent="Cache PWA nettoyé. Tes données locales n'ont pas été effacées.";
    document.getElementById('openBtn').style.display='block';
  }catch(e){
    status.className='err';
    status.textContent="Le nettoyage automatique a rencontré une erreur. Recharge cette page puis réessaie.";
  }
})();
</script>
</body>
</html>
